# Checked-in license allowlist for `scripts/check-licenses.py` (CI gate 8,
# Dependency licence inventory for reproducible public builds.
#
# Photon Commander is GPL-3.0-only. Permissive dependencies are accepted; weak-copyleft
# dependencies require an explicit reviewed entry and their notices/source or
# replacement obligations must be met by the packaged artifact. GPL/AGPL
# runtime dependencies are not accepted into the application process.
#
# A dependency not listed here fails the build. A dependency whose reported
# license text differs from what is recorded here fails the build too — that
# is the signal that a transitive dependency changed license on an update and
# needs a human look, not a silent pass.
#
# `status`:
#   "ok"        permissive / weak-copyleft license accepted as-is.
#   "reviewed"  copyleft or otherwise notable; `note` records why it is safe.
#
# Categories present today:
#   - permissive (MIT/BSD/Apache/PSF/0BSD/CC0): "ok", no note needed.
#   - MPL-2.0 (certifi, hypothesis, pathspec): weak (file-level) copyleft,
#     used unmodified as a library dependency — "ok".
#   - zeroconf: LGPL-2.1-or-later, used unmodified via normal Python import.
#     The commercial artifact ships its licence and exact source archive and
#     preserves replacement/debugging rights. "reviewed".
#   - pyinstaller / pyinstaller-hooks-contrib: see the note on each package
#     below — this one needed an actual read of the shipped LICENSE text,
#     not just the pip-licenses classifier. "reviewed".

