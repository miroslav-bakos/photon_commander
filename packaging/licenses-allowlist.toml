Build-tool-only dependency used by Nuitka to adjust ELF metadata in the
standalone Linux artifact. patchelf is executed during the build and is not
copied into the Photon Commander package. The PyPI wrapper reports Apache-2.0
and the patchelf executable reports GPL-3.0-or-later; neither license extends
to binaries that the unmodified tool processes.
"""

[packages.pyinstaller]
license = "GNU General Public License v2 (GPLv2)"
status = "reviewed"
note = """
pip-licenses reports this as bare 'GPLv2' from PyInstaller's trove classifier,
which is incomplete — the shipped COPYING.txt (read for pyinstaller==6.22.2,
the version pinned in uv.lock) actually says: "PyInstaller is licensed under
the terms of the GNU General Public License as published by the Free Software
Foundation; either version 2 of the License, or (at your option) any later
version." That is SPDX GPL-2.0-or-later, not GPL-2.0-only.

That compatibility question would not even need to be reached, though, because
COPYING.txt also grants an explicit, separate "Bootloader Exception":
"In addition to the permissions in the GNU General Public License, the
authors give you unlimited permission to link or embed compiled bootloader
and related files into combinations with other programs, and to distribute
those combinations without any restriction coming from the use of those
files." Our packaged ssc-core artifact embeds exactly that: the compiled
bootloader PyInstaller builds, nothing from PyInstaller's own Python source.
The exception covers our use plainly and says so in its own words — this is
not a case where a blocker was papered over.

Separately, and independently sufficient on its own: pyinstaller is a
dev-dependency-group, build-tool-only package. Its source is never vendored
into ssc/ and never shipped as a Python package inside the artifact.
"""

[packages."pyinstaller-hooks-contrib"]
license = "Apache Software License; GNU General Public License v2 (GPLv2)"
status = "reviewed"
note = """
Same pip-licenses classifier imprecision as pyinstaller above. Its own
LICENSE file states hooks are "licensed ... either version 2 of the License,
or (at your option) any later version (SPDX GPL-2.0-or-later)"; runtime hooks
bundled into built executables are separately licensed Apache-2.0. GPL-2.0-
or-later is GPL-3-compatible; Apache-2.0 is permissive. Also build-tool only
(dev group); never shipped as a Python package inside the packaged artifact.
"""

