# --- JavaScript / web ------------------------------------------------------
#
# Allow-by-license rather than allow-by-package. The Python side lists every
# package because that tree is stable; the JS tree will be hundreds of entries
# once Aladin's ecosystem lands in M4, and a per-package list there would be
# pure noise — and noise is how a gate gets disabled. Anything outside this
# permissive set needs an explicit exception below, with a note.
#
# The production browser bundle is permissive-only. GPL, LGPL, AGPL,
# non-commercial, no-derivatives, UNLICENSED and missing licence grants fail.

[javascript]
allowed_licenses = [
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Apache-2.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "Python-2.0",
    "(MIT OR CC0-1.0)",
]

