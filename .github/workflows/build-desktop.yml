name: Private Linux and macOS candidates
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref resolved once to a full source SHA
        required: true
        default: main
        type: string
      appimagetool_url:
        description: Official tool URL; bytes must match the existing SHA256 pin
        default: https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        type: string
permissions:
  contents: read
jobs:
  resolve:
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - id: identity
        shell: bash
        run: |
          commit=$(git rev-parse HEAD)
          [[ $commit =~ ^[a-f0-9]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
  desktop:
    needs: resolve
    if: ${{ github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      SSC_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      SSC_BUILD_COMMIT: ${{ needs.resolve.outputs.commit }}
      SSC_DESKTOP_TARGET: ${{ matrix.target }}
      SSC_APPIMAGETOOL_URL: ${{ inputs.appimagetool_url }}
      UV_PYTHON: '3.12'
      UV_PYTHON_PREFERENCE: only-managed
      UV_FROZEN: '1'
      SSC_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils patchelf file bubblewrap squashfs-tools libfuse2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: '3.12'
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build private unsigned native candidate
        run: bash scripts/ci-build-desktop.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: photon-${{ matrix.target }}-${{ needs.resolve.outputs.commit }}-unsigned
          path: dist/desktop/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
