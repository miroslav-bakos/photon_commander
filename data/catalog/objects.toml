# SSC bundled offline target catalogue — the Messier core (public domain)
#
# Purpose (DESIGN.md 3.1/3.4): resolve a typed target name to J2000 RA/Dec plus
# enough metadata to frame it, with **no network call** — a dark site often has
# no signal (DESIGN.md 6 makes the same point about weather). ssc.astro.catalog
# reads this file once at load time, first in precedence, and merges it with
# the two derived files beside it (THIRD_PARTY_NOTICES.md, "Bundled star catalogue"):
#   - openngc.csv    NGC 1-7840 + IC 1-5386, derived from OpenNGC (CC BY-SA 4.0;
#                    kept separate so that licence attaches to that file alone)
#   - sharpless.csv  Sh2-1-313, derived from NASA HEASARC's hiiregion table
# This file deliberately contains ONLY the 110 Messier objects, so its
# provenance statement below stays true of every row in it.
#
# --- Provenance and licensing -----------------------------------------------
#
# Every field below is a measured/catalogued astrometric or photometric fact —
# a right ascension, a declination, an angular size, an apparent magnitude, a
# catalogue cross-designation, a constellation, or a common name in ordinary
# use. Under US copyright law such facts are not protected expression (Feist
# Publications v. Rural Telephone Service, 499 U.S. 340 (1991)): they are the
# same numbers regardless of which almanac or planetarium prints them, and no
# creative selection or arrangement of them is reproduced here beyond a plain
# table. No descriptive prose, imagery, or other copyrightable expression from
# any source is included in this file.
#
# Values were compiled and cross-checked against the NASA HEASARC Messier
# catalog table, https://heasarc.gsfc.nasa.gov/w3browse/all/messier.html
# (NASA-hosted, US-government public domain; positions, types, magnitudes and
# sizes agree with the standard published Messier data reproduced across SEDS,
# RASC and other public catalogues). The 21 curated NGC/IC entries this file
# once carried, which had been checked against a share-alike-licensed
# compilation, were removed on 2026-09-07 (IMPLEMENTATION.md M11, "The data
# rule"); those objects now resolve from openngc.csv.
#
# A field is omitted (never guessed) wherever a source did not give it a
# confident value — ssc.astro.catalog surfaces that as None, per CLAUDE.md:
# "None means unknown; it never means zero."
#
# `source` is the credit line ssc.astro.catalog attaches to every object read
# from this file; the UI shows it verbatim.
source = "Messier catalogue, public-domain data cross-checked against NASA HEASARC"

# Schema: [[objects]]
#   designations         list of strings, at least one ("M31", "NGC 224", ...)
#   common_name          string, optional
#   object_type          one of ssc.astro.catalog.ObjectType, optional
#   ra_j2000_h           float, hours [0, 24)
#   dec_j2000_deg        float, degrees [-90, 90]
#   magnitude            float, optional (apparent visual magnitude, V band)
#   size_major_arcmin    float, optional
#   size_minor_arcmin    float, optional (omitted when the source gives only
#                        one dimension; never assumed equal to the major axis)
#   position_angle_deg   float, optional (major-axis PA, north through east)
#   constellation        string, optional (IAU 3-letter or full name as given)

