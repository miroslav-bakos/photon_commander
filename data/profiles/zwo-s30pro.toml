# ZWO Seestar S30 Pro — scope profile
#
# Optical/sensor values are derived from published specifications. The tele
# figures reproduce the published 4.6 deg diagonal to within 0.5%, so they are
# trustworthy as a starting point. Replace them with plate-solved measurements
# via Settings > Calibrate from plate solve (see docs/DESIGN.md section 7).

id = "zwo-s30pro"
name = "ZWO Seestar S30 Pro"
vendor = "ZWO"
aliases = ["Seestar S30 Pro", "S30 Pro", "SeestarS30Pro"]
source_urls = [
  "https://us.zwoastro.com/products/seestar-s30-pro",
  "https://i.zwoastro.com/wp-content/uploads/2026/01/779193e9ce7a1f0f1b7db9da8a752e49.pdf",
]
mount = "altaz"
eq_mode_available = true

[capabilities]
tele_camera = true
wide_camera = true
wide_camera_autofocus = true
focuser = true
filter_wheel = true
dew_heater = true

[[optics]]
id = "tele"
label = "Telephoto"
focal_length_mm = 160.0
aperture_mm = 30.0
focal_ratio = 5.3
design = "quadruplet APO (ED)"
# PORTRAIT. Measured from the device, not from the datasheet: the Alpaca camera
# reports cameraxsize=2160 / cameraysize=3840, and every FITS it writes carries
# NAXIS1=2160 / NAXIS2=3840. The IMX585 is a 16:9 part mounted rotated, so the
# frame delivered to the sky is taller than it is wide. The profile previously
# said 3840 x 2160 and every FOV overlay was drawn rotated 90 degrees.
sensor = { name = "IMX585", w_px = 2160, h_px = 3840, pixel_um = 2.9 }
# derived: 3.74 arcsec/px -> 2.24 x 3.99 deg, 4.58 deg diagonal
# inscribed circle (alt-az long-session keep region): 2.24 deg — unchanged by
# the orientation fix, since it is the short side either way

[[optics]]
id = "wide"
label = "Wide-angle"
focal_length_mm = 6.0
aperture_mm = 3.4
focal_ratio = 1.75
# PORTRAIT, same as the tele. Pixel size 1.6 um is what the device reports
# (Alpaca pixelsizex/y on camera/1); the profile previously said 1.5 um.
#
# That creates a conflict worth stating rather than hiding: 1.5 um with a 6.0 mm
# focal length reproduces the published 63 deg diagonal almost exactly, while
# 1.6 um implies about 6.4 mm for the same diagonal. The device is authoritative
# about its own pixel pitch; the 6.0 mm focal length is a datasheet figure. So
# the focal length below is the doubtful number, not the pixel size — and this
# is precisely what the plate-solve calibration in DESIGN.md section 7 exists to
# settle. Until it runs, the wide overlay is approximate for two reasons, not one.
sensor = { name = "IMX586", w_px = 2160, h_px = 3840, pixel_um = 1.6 }
distortion = "approximate"   # back-solved from the 63 deg spec diagonal
                             # assuming rectilinear projection; overlay is
                             # indicative only, not framing-accurate

[defaults]
gain = 200
exposure_stack_ms = 10000
exposure_preview_ms = 500
dither_enabled = true
dither_pixels = 50
dither_every_n_frames = 10
lp_filter = false
dew_heater_percent = 0

[limits]
min_altitude_deg = 20.0
battery_low_percent = 15

[calibration]
# Written by the plate-solve calibration flow. Until measured = true, all
# overlays are datasheet-derived.
measured = false
